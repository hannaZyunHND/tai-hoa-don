<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Tải hoá đơn GDT</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Tải hoá đơn GDT</h1>
    <p class="sub">Mua vào · PDF zip theo năm/tháng</p>
  </header>

  <section class="card">
    <div class="row between">
      <span class="label">Bearer token</span>
      <span id="tokenBadge" class="badge bad">Chưa có</span>
    </div>
    <p id="tokenMeta" class="meta">Mở trang tra cứu và bấm Tìm kiếm để bắt token.</p>
    <button id="btnOpen" class="btn ghost" type="button">Mở trang tra cứu</button>
  </section>

  <section class="card">
    <label class="label" for="year">Năm</label>
    <input id="year" type="number" min="2010" max="2100" required />

    <label class="label" for="month">Tháng (tuỳ chọn)</label>
    <select id="month">
      <option value="">Cả năm</option>
      <option value="1">01</option>
      <option value="2">02</option>
      <option value="3">03</option>
      <option value="4">04</option>
      <option value="5">05</option>
      <option value="6">06</option>
      <option value="7">07</option>
      <option value="8">08</option>
      <option value="9">09</option>
      <option value="10">10</option>
      <option value="11">11</option>
      <option value="12">12</option>
    </select>

    <label class="label" for="limit">Giới hạn test (tuỳ chọn)</label>
    <input id="limit" type="number" min="1" placeholder="Để trống = tất cả" />

    <button id="btnDownload" class="btn primary" type="button">Tải ZIP PDF</button>
  </section>

  <section class="card">
    <div class="label">Tiến trình</div>
    <div class="progress-wrap">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <p id="progressText" class="meta">Chưa chạy.</p>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
